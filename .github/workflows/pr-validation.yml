name: PR Validation

on:
  workflow_dispatch:
    inputs:
      run_knip:
        description: Run Knip
        required: false
        default: true
        type: boolean
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Test coverage
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm run audit

      - name: Knip
        if: ${{ github.event_name == 'pull_request' || inputs.run_knip }}
        run: npm run knip
